<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voz · escuchando</title>
<style>
:root{
  color-scheme: light;

  /* Surfaces — constraint 1: dominant surface is white/near-white */
  --paper:        #FFFFFF;
  --paper-sunk:   #FAF9FC;
  --rule:         #E9E6F0;
  --rule-strong:  #DCD8E6;

  /* Ink — a near-black carrying the violet hue family, not a second hue */
  --ink:          #221B33;   /* 16.5:1 on white */
  --ink-soft:     #5E5770;   /*  6.83:1 on white; 5.12:1 on --violet-wash2 (pressed) */
  --ink-ghost:    #B4AEC2;   /* non-text only: rules, faded tally marks */

  /* Violet — the only brand hue (constraint 2) */
  --violet:       #5A2FCE;   /* 7.69:1 on white, and white on it */
  --violet-deep:  #3F1F96;   /* pressed */
  --violet-line:  #D5C9F6;
  --violet-wash:  #F2EDFD;
  --violet-wash2: #E5DAFA;

  /* The one functional colour beyond violet (constraint 3):
     destructive confirmation and validation errors, nowhere else */
  --danger:       #C0182B;   /* 6.16:1 on white */
  --danger-wash:  #FDF1F2;

  /* Violet tint ramp for the month breakdown (constraint 4) */
  --t1:#4A24A8; --t2:#5A2FCE; --t3:#7A57DC; --t4:#9A82E7; --t5:#B6A6EF;
  --t6:#CBBEF3; --t7:#DBD2F7; --t8:#E7E1FA; --t9:#EFEBFC; --t10:#F4F1FD;

  --pad: 20px;      /* Finanzas gutter */
  --pad-diario: 24px;  /* Diario is roomier */
  --r-sheet: 22px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Lato','Lato Regular',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px;
  color:var(--ink);
  background:#EDEAF2;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul{list-style:none;padding:0}
button{font:inherit;color:inherit;background:none;border:0;margin:0}
a{color:inherit;text-decoration:none}

/* ---------- device frame (mockup scaffolding, not app UI) ---------- */
.phone{
  width:min(390px,100vw);height:844px;margin:0 auto;
  background:var(--paper);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
@media (min-width:391px){
  body{padding:28px 0 40px}
  .phone{box-shadow:0 2px 40px rgba(34,27,51,.16);border-radius:26px}
}

.statusbar{
  flex:0 0 26px;display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--pad);font-size:12px;font-weight:700;color:var(--ink-soft);
  letter-spacing:.01em;
}
.statusbar .sig{display:flex;gap:3px;align-items:flex-end}
.statusbar .sig i{display:block;width:3px;background:var(--ink-soft);border-radius:1px}
.statusbar .sig i:nth-child(1){height:4px}
.statusbar .sig i:nth-child(2){height:6px}
.statusbar .sig i:nth-child(3){height:8px}
.statusbar .bat{width:20px;height:10px;border:1.5px solid var(--ink-soft);border-radius:3px;position:relative}
.statusbar .bat::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:11px;background:var(--ink-soft);border-radius:1px}

/* ---------- app bar / tabs ---------- */
.appbar{
  flex:none;padding:6px var(--pad) 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px;
}
.appbar .mod{
  font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
}
.appbar .act{
  font-size:15px;font-weight:700;color:var(--violet);
  min-height:44px;display:inline-flex;align-items:center;padding:0 2px;
}
.appbar .act:hover,.appbar .act.is-hover{color:var(--violet-deep);text-decoration:underline;text-underline-offset:3px}
.appbar .act:active,.appbar .act.is-active-press{color:var(--violet-deep)}

.tabs{flex:none;display:flex;gap:10px;padding:0 calc(var(--pad) - 9px);border-bottom:1px solid var(--rule)}
.tab{
  position:relative;min-height:46px;min-width:44px;display:inline-flex;
  align-items:center;justify-content:center;
  font-size:16px;font-weight:600;color:var(--ink-soft);padding:0 9px;
}
.tab.is-on{color:var(--ink);font-weight:700}
.tab.is-on::after{
  content:"";position:absolute;left:9px;right:9px;bottom:-1px;height:2.5px;
  background:var(--violet);border-radius:2px;
}
.tab:hover,.tab.is-hover{color:var(--ink)}
.tab:active,.tab.is-active-press{color:var(--violet-deep)}

/* ---------- scroll body ---------- */
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding-left:var(--pad);padding-right:var(--pad)}
.diario .pad,.diario .hero{padding-left:var(--pad-diario);padding-right:var(--pad-diario)}

/* ---------- hero total ---------- */
.hero{padding:22px var(--pad) 18px}
.hero .when{font-size:14px;font-weight:600;color:var(--ink-soft);letter-spacing:.01em}
.hero .sum{
  font-size:46px;font-weight:300;letter-spacing:-.025em;line-height:1.05;margin-top:6px;
  font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1;
}
.hero .sub{margin-top:7px;font-size:14px;color:var(--ink-soft)}
.hero--mes .sum{font-size:40px}

.monthnav{display:flex;align-items:center;gap:2px;margin-top:2px}
.monthnav .mname{flex:1;font-size:22px;font-weight:700;letter-spacing:-.01em}
.arrow{
  width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:999px;color:var(--violet);
}
.arrow:hover,.arrow.is-hover{background:var(--violet-wash)}
.arrow:active,.arrow.is-active-press{background:var(--violet-wash2);color:var(--violet-deep)}
.arrow[disabled],.arrow.is-disabled{color:var(--ink-ghost);background:none;cursor:not-allowed}

/* ---------- section label ---------- */
.slabel{
  font-size:11.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-soft);padding:22px var(--pad) 10px;
}
.diario .slabel{padding-left:var(--pad-diario);padding-right:var(--pad-diario)}

/* ---------- ledger rows (Finanzas: ruled like a notebook) ---------- */
.ledger{border-top:1px solid var(--rule)}
.row{
  display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;
  min-height:60px;padding:13px var(--pad);border-bottom:1px solid var(--rule);
}
.row .what{flex:1;min-width:0}
.row .cat{display:block;font-size:17px;font-weight:600;letter-spacing:-.005em}
.row .meta{display:block;font-size:13.5px;color:var(--ink-soft);margin-top:3px;
  line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{
  font-size:17px;font-weight:700;white-space:nowrap;padding-top:1px;
  font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1;
}
.row:hover,.row.is-hover{background:var(--violet-wash)}
.row:active,.row.is-active-press{background:var(--violet-wash2)}
.row:focus-visible,.row.is-focus{outline:2.5px solid var(--violet);outline-offset:-2.5px;background:var(--violet-wash)}

/* ---------- breakdown ---------- */
.brk{padding:0 var(--pad)}
.brk li{padding:11px 0 13px;border-bottom:1px solid var(--rule)}
.brk .line{display:flex;align-items:baseline;gap:10px}
.brk .name{flex:1;font-size:16px;font-weight:600}
.brk .val{
  font-size:16px;font-weight:700;font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
}
.brk .pct{width:44px;text-align:right;font-size:14px;font-weight:700;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;}
.brk .track{margin-top:9px;height:7px;border-radius:4px;background:var(--paper-sunk)}
.brk .fill{height:7px;border-radius:4px;background:var(--t2)}

.pm li{display:flex;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.pm .name{flex:1;font-size:16px;font-weight:600}
.pm .val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- empty states ---------- */
.empty{padding:44px var(--pad) 28px;max-width:330px}
.diario .empty{padding-left:var(--pad-diario);padding-right:var(--pad-diario)}
.empty .mark{width:34px;height:2.5px;border-radius:2px;background:var(--violet);margin-bottom:20px}
.empty h2{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.empty p{margin-top:10px;font-size:15.5px;line-height:1.6;color:var(--ink-soft)}

/* ---------- capture bar + nav ---------- */
.capture{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:10px var(--pad) 12px;background:var(--paper);
  border-top:1px solid var(--rule);
}
.capture .manual{
  flex:1;min-height:52px;border-radius:999px;border:1.5px solid var(--violet-line);
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-size:16px;font-weight:700;color:var(--violet);background:var(--paper);
}
.capture .manual:hover,.capture .manual.is-hover{background:var(--violet-wash);border-color:var(--violet)}
.capture .manual:active,.capture .manual.is-active-press{background:var(--violet-wash2);color:var(--violet-deep);border-color:var(--violet-deep)}
.capture .manual:focus-visible,.capture .manual.is-focus{outline:2.5px solid var(--violet);outline-offset:2px}
.mic{
  width:58px;height:58px;border-radius:999px;background:var(--violet);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.mic:hover,.mic.is-hover{background:var(--violet-deep)}
.mic:active,.mic.is-active-press{background:var(--violet-deep);transform:scale(.96)}
.mic:focus-visible,.mic.is-focus{outline:2.5px solid var(--violet);outline-offset:3px}
.mic[disabled],.mic.is-disabled{background:var(--paper-sunk);color:var(--ink-soft);border:1.5px solid var(--rule);cursor:not-allowed}

.nav{
  flex:none;display:flex;background:var(--paper);border-top:1px solid var(--rule);
  padding-bottom:8px;
}
.nav a{
  flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:14px;font-weight:600;color:var(--ink-soft);
}
.nav a.is-on{color:var(--violet);font-weight:700}
.nav a:hover,.nav a.is-hover{background:var(--violet-wash)}
.nav a:active,.nav a.is-active-press{background:var(--violet-wash2)}
.nav a:focus-visible,.nav a.is-focus{outline:2.5px solid var(--violet);outline-offset:-3px;border-radius:10px}
.nav .soon{display:block;height:13px;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft)}

/* ---------- forms ---------- */
.field{padding:18px var(--pad) 0}
.diario .field{padding-left:var(--pad-diario);padding-right:var(--pad-diario)}
.flabel{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:9px}
.flabel .opt{text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink-soft)}

.amountbox{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--rule-strong);padding-bottom:6px}
.amountbox .cur{font-size:30px;font-weight:300;color:var(--ink-soft)}
.amountbox .val{
  font-size:38px;font-weight:400;letter-spacing:-.02em;flex:1;border:0;outline:0;background:none;
  font-variant-numeric:tabular-nums lining-nums;min-width:0;padding:0;color:var(--ink);
  min-height:46px;line-height:46px;
}
.amountbox .val::placeholder{color:var(--ink-ghost)}
.amountbox.is-focus,.amountbox:focus-within{border-bottom-color:var(--violet)}
.amountbox.is-err{border-bottom-color:var(--danger)}
.caret{display:inline-block;width:2px;height:34px;background:var(--violet);vertical-align:-6px;animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}

.input,.textarea{
  width:100%;font:inherit;font-size:16.5px;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--rule-strong);border-radius:14px;padding:13px 14px;min-height:52px;
}
.input::placeholder,.textarea::placeholder{color:var(--ink-soft)}
.input:hover,.input.is-hover,.textarea:hover,.textarea.is-hover{border-color:var(--violet-line)}
.input:focus,.input.is-focus,.textarea:focus,.textarea.is-focus{outline:2.5px solid var(--violet);outline-offset:1px;border-color:var(--violet)}
.input.is-err,.textarea.is-err{border-color:var(--danger)}
.input[disabled],.input.is-disabled,.textarea[disabled],.textarea.is-disabled{background:var(--paper-sunk);color:var(--ink-soft);border-color:var(--rule);cursor:not-allowed}
.textarea{min-height:120px;line-height:1.6;resize:none}

.hint{margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
.err{
  margin-top:9px;font-size:14px;font-weight:600;color:var(--danger);
  display:flex;gap:7px;align-items:flex-start;line-height:1.45;
}
.err svg{flex:none;margin-top:1px}

/* chips: the single-tap control pattern that keeps capture inside four taps */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:44px;padding:0 15px;border-radius:999px;border:1.5px solid var(--rule-strong);
  background:var(--paper);font-size:15px;font-weight:600;color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;
}
.chip:hover,.chip.is-hover{background:var(--violet-wash);border-color:var(--violet-line)}
.chip:active,.chip.is-active-press{background:var(--violet-wash2);border-color:var(--violet);color:var(--violet-deep)}
.chip:focus-visible,.chip.is-focus{outline:2.5px solid var(--violet);outline-offset:2px}
.chip.is-on{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:700}
.chip.is-on:hover,.chip.is-on.is-hover{background:var(--violet-deep);border-color:var(--violet-deep)}
.chip.is-on:active,.chip.is-on.is-active-press{background:var(--violet-deep);color:#fff}
.chip[disabled],.chip.is-disabled{background:var(--paper-sunk);border-color:var(--rule);color:var(--ink-soft);cursor:not-allowed}
.chip--new{border-style:dashed;color:var(--violet);border-color:var(--violet-line)}
.chip--new:hover,.chip--new.is-hover{border-color:var(--violet);background:var(--violet-wash)}
.chips.is-missing{
  border:1.5px dashed var(--violet-line);border-radius:16px;padding:10px;
  background:var(--violet-wash);
}

.tag{
  display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;
  font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--violet-wash);color:var(--violet);
}
.tag--need{background:var(--paper);color:var(--ink-soft);border:1.5px dashed var(--rule-strong)}

/* ---------- buttons ---------- */
.btn{
  width:100%;min-height:54px;border-radius:999px;font-size:17px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 20px;
}
.btn--primary{background:var(--violet);color:#fff}
.btn--primary:hover,.btn--primary.is-hover{background:var(--violet-deep)}
.btn--primary:active,.btn--primary.is-active-press{background:var(--violet-deep);transform:scale(.985)}
.btn--primary:focus-visible,.btn--primary.is-focus{outline:2.5px solid var(--violet);outline-offset:3px}
.btn--primary[disabled],.btn--primary.is-disabled{background:var(--paper-sunk);color:var(--ink-soft);border:1.5px solid var(--rule);cursor:not-allowed}
.btn--ghost{background:var(--paper);color:var(--violet);border:1.5px solid var(--violet-line)}
.btn--ghost:hover,.btn--ghost.is-hover{background:var(--violet-wash);border-color:var(--violet)}
.btn--ghost:active,.btn--ghost.is-active-press{background:var(--violet-wash2);color:var(--violet-deep)}
.btn--ghost:focus-visible,.btn--ghost.is-focus{outline:2.5px solid var(--violet);outline-offset:3px}
.btn--ghost[disabled],.btn--ghost.is-disabled{background:var(--paper-sunk);color:var(--ink-soft);border-color:var(--rule);cursor:not-allowed}
.btn--danger{background:var(--danger);color:#fff}
.btn--danger:hover,.btn--danger.is-hover{background:#9E1123}
.btn--danger:active,.btn--danger.is-active-press{background:#8B0E1E}
.btn--danger:focus-visible,.btn--danger.is-focus{outline:2.5px solid var(--danger);outline-offset:3px}
.btn--text{background:none;color:var(--violet);min-height:48px;font-size:16px}
.btn--text:hover,.btn--text.is-hover{background:var(--violet-wash)}
.btn--text:active,.btn--text.is-active-press{background:var(--violet-wash2);color:var(--violet-deep)}
.btn--text:focus-visible,.btn--text.is-focus{outline:2.5px solid var(--violet);outline-offset:2px}
.btnrow{display:flex;gap:10px}
.formfoot{padding:22px var(--pad) 24px}
.diario .formfoot{padding-left:var(--pad-diario);padding-right:var(--pad-diario)}

/* ---------- sheets / modals ---------- */
.veil{position:absolute;inset:0;background:rgba(34,27,51,.34);display:flex;align-items:flex-end}
.sheet{
  width:100%;background:var(--paper);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:10px var(--pad) 22px;
}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--rule-strong);margin:0 auto 16px}
.sheet h2{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.sheet p{margin-top:10px;font-size:15.5px;line-height:1.6;color:var(--ink-soft)}
.sheet .subject{
  margin-top:14px;padding:13px 15px;border-radius:14px;background:var(--paper-sunk);
  font-size:16px;font-weight:600;
}
.sheet .acts{margin-top:20px;display:flex;flex-direction:column;gap:10px}

/* ---------- banners ---------- */
.banner{
  display:flex;gap:11px;align-items:flex-start;
  margin:14px var(--pad) 0;padding:14px 15px;border-radius:16px;
  background:var(--violet-wash);border:1.5px solid var(--violet-line);
}
.banner svg{flex:none;margin-top:1px;color:var(--violet)}
.banner .b-t{font-size:15px;font-weight:700;line-height:1.35}
.banner .b-d{margin-top:4px;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
.banner .b-a{margin-top:10px;display:inline-flex;align-items:center;min-height:44px;font-size:15px;font-weight:700;color:var(--violet)}
.banner .b-a:hover,.banner .b-a.is-hover{text-decoration:underline;text-underline-offset:3px}
.banner--flat{background:var(--paper-sunk);border-color:var(--rule)}
.banner--flat svg{color:var(--ink-soft)}

.note{
  margin-top:14px;padding:12px 14px;border-left:2.5px solid var(--violet-line);
  background:var(--violet-wash);border-radius:0 12px 12px 0;
  font-size:13.5px;line-height:1.55;color:var(--ink-soft);
}
.note b{color:var(--ink);font-weight:700}

/* ---------- waiting: the tally ---------- */
.wait{padding:34px var(--pad) 0}
.wait h2{font-size:22px;font-weight:700;letter-spacing:-.012em;line-height:1.3}
.wait .phase{margin-top:9px;font-size:15px;font-weight:600;color:var(--violet)}
.wait .said{margin-top:6px;font-size:15px;line-height:1.6;color:var(--ink-soft)}
.tallywrap{margin-top:26px}
.tally{display:flex;flex-wrap:wrap;gap:13px;align-items:flex-end;min-height:24px}
.grp{display:flex;align-items:flex-end;height:22px;position:relative}
.tick{width:2.5px;height:20px;border-radius:1px;background:var(--violet);margin-right:4px}
.tick--5{position:absolute;left:0;right:0;margin:0 auto;width:2px;height:23px;
  background:var(--violet);transform:rotate(26deg);transform-origin:center;height:25px}
.grp--part .tick:last-child{margin-right:0}
.secs{
  margin-top:16px;display:flex;align-items:baseline;gap:8px;
}
.secs .n{font-size:32px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.secs .u{font-size:15px;font-weight:600;color:var(--ink-soft)}
.wait .local{
  margin-top:20px;font-size:14.5px;line-height:1.6;color:var(--ink-soft);max-width:320px;
}
.wait .acts{margin-top:26px;display:flex;flex-direction:column;gap:10px}

/* listening: a bounded wait, so a determinate meter is honest here */
.listen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 var(--pad);text-align:center}
.pulse{
  width:132px;height:132px;border-radius:999px;background:var(--violet);
  display:flex;align-items:center;justify-content:center;color:#fff;position:relative;
}
.pulse::before,.pulse::after{
  content:"";position:absolute;inset:-1px;border-radius:999px;border:2.5px solid var(--violet);
  animation:ring 2.6s ease-out infinite;
}
.pulse::after{animation-delay:1.3s}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
.listen h2{margin-top:28px;font-size:24px;font-weight:700;letter-spacing:-.015em}
.listen .clock{margin-top:10px;font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.listen .cap{margin-top:14px;width:220px}

/* ---------- análisis ---------- */
.card{padding:20px var(--pad) 22px;border-bottom:1px solid var(--rule)}

.askrow .input{flex:1}
.askmic{

.askmic:hover,.askmic.is-hover{background:var(--violet-deep)}

.askmic[disabled],.askmic.is-disabled{background:var(--paper-sunk);color:var(--ink-soft);border:1.5px solid var(--rule);cursor:not-allowed}
.qhead{font-size:15px;font-weight:700;line-height:1.45}
.facts{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
.facts li{display:flex;gap:12px;align-items:baseline;padding:6px 0;font-size:14.5px}

.statecap{
  font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
  padding:18px var(--pad) 0;

/* ---------- gym ---------- */
.gym{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad) 60px}
.gym .mark{width:34px;height:2.5px;border-radius:2px;background:var(--violet-line);margin-bottom:22px}
.gym h1{font-size:27px;font-weight:700;letter-spacing:-.015em}
.gym p{margin-top:12px;font-size:16.5px;line-height:1.62;color:var(--ink-soft);max-width:300px}

/* ---------- offline full screen ---------- */
.offline{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad) 40px}
.offline .mark{width:34px;height:2.5px;border-radius:2px;background:var(--violet);margin-bottom:22px}
.offline h1{font-size:27px;font-weight:700;letter-spacing:-.017em;line-height:1.25}
.offline p{margin-top:13px;font-size:16.5px;line-height:1.62;color:var(--ink-soft)}
.offline .acts{margin-top:30px;display:flex;flex-direction:column;gap:10px}
.offline .addr b{display:block;margin-top:6px;color:var(--ink);font-weight:700;
  overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.offline .addr{
  margin-top:14px;font-size:13.5px;color:var(--ink-soft);line-height:1.55;
}

/* ---------- state catalogue pages (review artefact) ---------- */
.cat-wrap{max-width:920px;margin:0 auto;padding:26px 20px 60px}
.cat-wrap h1{font-size:26px;font-weight:700;letter-spacing:-.015em}

.cat-grid{display:flex;flex-wrap:wrap;gap:18px;margin-top:24px}
.cat-cell{background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:16px;width:354px}
.cat-cell h3{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.cat-cell .why{margin-top:6px;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
.cat-cell .demo{margin-top:14px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
(function(){
  var q=new URLSearchParams(location.search);
  var s=q.get('scroll'); if(s){var sc=document.querySelector('.scroll'); if(sc) sc.scrollTop=parseInt(s,10);}
  if(q.get('audit')!=='1') return;
  function lum(c){
    var m=c.match(/[\d.]+/g); if(!m) return null;
    var a=m.length>3?parseFloat(m[3]):1; if(a===0) return null;
    var f=[m[0],m[1],m[2]].map(function(v){v=v/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
    return {L:0.2126*f[0]+0.7152*f[1]+0.0722*f[2],a:a,rgb:[+m[0],+m[1],+m[2]]};
  }
  function bgOf(el){
    var e=el;
    while(e&&e!==document.documentElement){
      var c=getComputedStyle(e).backgroundColor, o=lum(c);
      if(o&&o.a>=0.95) return o;
      e=e.parentElement;
    }
    return {L:1,a:1,rgb:[255,255,255]};
  }
  var badC=[],badT=[],all=document.querySelectorAll('*');
  for(var i=0;i<all.length;i++){
    var el=all[i],cs=getComputedStyle(el);
    if(cs.display==='none'||cs.visibility==='hidden') continue;
    var hasText=false;
    for(var j=0;j<el.childNodes.length;j++){
      var n=el.childNodes[j];
      if(n.nodeType===3&&n.textContent.trim().length>0){hasText=true;break;}
    }
    if(hasText){
      var fg=lum(cs.color);
      if(fg&&fg.a>0.1){
        var bg=bgOf(el);
        var r=(Math.max(fg.L,bg.L)+0.05)/(Math.min(fg.L,bg.L)+0.05);
        var size=parseFloat(cs.fontSize),w=parseInt(cs.fontWeight,10)||400;
        var large=(size>=24)||(size>=18.66&&w>=700);
        var need=large?3:4.5;
        if(r<need-0.005){
          badC.push(el.tagName+'.'+(el.className||'')+' '+r.toFixed(2)+'<'+need+' "'+el.textContent.trim().slice(0,22)+'"');
          el.style.outline='3px dashed #C0182B';
        }
      }
    }
    if(el.matches('a[href],button,input,textarea,select,[role="button"],.chip,.tab,.more,.entry,.row')){
      var b=el.getBoundingClientRect();
      if(b.width>0&&b.height>0&&(b.width<44||b.height<44)){
        badT.push(el.tagName+'.'+(el.className||'')+' '+Math.round(b.width)+'x'+Math.round(b.height));
        el.style.outline='3px dashed #C0182B';
      }
    }
  }
  var h=document.documentElement.scrollWidth>window.innerWidth+0.5?1:0;
  document.title='AUDIT h='+h+' t='+badT.length+' c='+badC.length+
     (badT.length?' | T: '+badT.join(' ; '):'')+(badC.length?' | C: '+badC.join(' ; '):'');
})();
</script>
